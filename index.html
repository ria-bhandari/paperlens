<!DOCTYPE html>
<!-- Paperlens © 2026 Ria Bhandari. All rights reserved. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#f2f4f7">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperlens</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paperlens">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="author" content="Ria Bhandari">
<meta name="copyright" content="© 2026 Ria Bhandari. All rights reserved.">
<meta name="description" content="Understand any research paper fast: overview, key figures, mind map, flashcards and games.">
<style>
:root{
  --bg:#f2f4f7; --card:#ffffff; --ink:#121a2f; --muted:#5b6479; --line:#d9dee8; --edge:#7b859c;
  --blue:#2447d6; --blue-ink:#ffffff; --blue-soft:#e6ebfc;
  --mark:#ffe066; --mark-ink:#121a2f;
  --good:#16694a; --good-soft:#dff3e9; --bad:#b02a20; --bad-soft:#fbe4e1;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,"Iowan Old Style",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --hh:56px; --wash-c:#2447d6; color-scheme:light;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0d1220; --card:#151c30; --ink:#e9edf7; --muted:#98a2ba; --line:#263050; --edge:#6a779c;
  --blue:#86a2ff; --blue-ink:#0d1220; --blue-soft:#1c2850;
  --mark:#ffd93d; --mark-ink:#121a2f;
  --good:#4fd39a; --good-soft:#12362a; --bad:#ff7d72; --bad-soft:#3d1a1a;
}
/* ---------- themes: each has a light and a dark variant ---------- */
:root[data-palette=spring]{--bg:#eff6ef;--card:#fbfefb;--ink:#14261c;--muted:#4f6256;--line:#d3e3d5;--edge:#72877a;--blue:#27724a;--blue-ink:#ffffff;--blue-soft:#dff0e3;--mark:#ffc4da;--wash-c:#5fb37c}
:root[data-palette=spring][data-theme=dark]{--bg:#0d1711;--card:#14211a;--ink:#e5f1e8;--muted:#9ab0a0;--line:#243a2c;--edge:#5e7b68;--blue:#7fd49b;--blue-ink:#0d1711;--blue-soft:#1a3324;--mark:#f4a6c6;--wash-c:#5fb37c}
:root[data-palette=golden]{--bg:#fbf2e2;--card:#fffcf5;--ink:#2b1b0d;--muted:#6a5642;--line:#ecdcbf;--edge:#907a5c;--blue:#a8480a;--blue-ink:#ffffff;--blue-soft:#fbe3c8;--mark:#ffcb5c;--wash-c:#f0a53a}
:root[data-palette=golden][data-theme=dark]{--bg:#19120b;--card:#231910;--ink:#f6e8d5;--muted:#baa58b;--line:#3a2b1b;--edge:#7c6445;--blue:#ffb15c;--blue-ink:#19120b;--blue-soft:#3a2514;--mark:#f5b942;--wash-c:#f0a53a}
:root[data-palette=fall]{--bg:#f3ede6;--card:#fffcf9;--ink:#2a1c17;--muted:#66554d;--line:#e1d3c6;--edge:#8c786b;--blue:#8c2f2a;--blue-ink:#ffffff;--blue-soft:#f3dcd5;--mark:#f0a766;--wash-c:#c0562f}
:root[data-palette=fall][data-theme=dark]{--bg:#191110;--card:#231917;--ink:#f1e3db;--muted:#b7a094;--line:#3a2925;--edge:#7b6256;--blue:#f08a70;--blue-ink:#191110;--blue-soft:#3a1f1b;--mark:#e8a05a;--wash-c:#c0562f}
:root[data-palette=winter]{--bg:#ecf3f7;--card:#fafdff;--ink:#0f2233;--muted:#4e6377;--line:#d0dfea;--edge:#6f869b;--blue:#0d6786;--blue-ink:#ffffff;--blue-soft:#dcedf5;--mark:#b6e3f4;--wash-c:#6fb8d6}
:root[data-palette=winter][data-theme=dark]{--bg:#0a141b;--card:#111e28;--ink:#e2eef6;--muted:#91a8ba;--line:#21364a;--edge:#5a7891;--blue:#6cc3e4;--blue-ink:#0a141b;--blue-soft:#12304a;--mark:#8fd3ee;--wash-c:#6fb8d6}
:root[data-palette=dusk]{--bg:#f3f0f8;--card:#fdfcff;--ink:#1d1632;--muted:#5d5675;--line:#ddd6ea;--edge:#7e7699;--blue:#5a35b8;--blue-ink:#ffffff;--blue-soft:#e8e1f8;--mark:#dcc3ff;--wash-c:#9b7bdc}
:root[data-palette=dusk][data-theme=dark]{--bg:#120e1f;--card:#1a1530;--ink:#ece7f8;--muted:#a59dbf;--line:#2d2550;--edge:#6e6498;--blue:#b79bff;--blue-ink:#120e1f;--blue-soft:#2a2050;--mark:#c7a2ff;--wash-c:#9b7bdc}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(1100px 460px at 85% -160px,color-mix(in srgb,var(--wash-c) 15%,transparent),transparent 72%),radial-gradient(800px 380px at -10% 0,color-mix(in srgb,var(--mark) 14%,transparent),transparent 70%);
  background-repeat:no-repeat;transition:background-color .35s}
:root[data-theme=dark] body{background-image:radial-gradient(1100px 460px at 85% -160px,color-mix(in srgb,var(--wash-c) 14%,transparent),transparent 72%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);line-height:1.15;margin:0;letter-spacing:-.01em}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;height:var(--hh);display:flex;align-items:center;gap:8px;
  padding:0 clamp(14px,3vw,28px);background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 6px 4px 0;
  font:700 21px var(--serif);letter-spacing:-.02em}
.brand svg{width:26px;height:26px}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--card);border-color:var(--line);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}

.tabs{position:sticky;top:var(--hh);z-index:25;display:flex;gap:2px;overflow-x:auto;padding:0 clamp(14px,3vw,28px);
  background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;border:0;background:none;padding:13px 14px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:4px;background:var(--mark);border-radius:4px 4px 0 0}
.tab small{margin-left:6px;color:var(--muted);font-weight:500}

main{max-width:1000px;margin:0 auto;padding:clamp(18px,3.5vw,40px) clamp(14px,3vw,28px) 80px}

/* ---------- buttons & bits ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;
  border:1px solid var(--edge);background:var(--card);font-weight:600;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;border-radius:8px}
.btn.ghost{background:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}
.mark{background:linear-gradient(transparent 12%,var(--mark) 12%,var(--mark) 88%,transparent 88%);color:var(--mark-ink);padding:0 .22em;margin:0 -.22em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:3px}
.chip{display:inline-block;padding:3px 10px;border-radius:6px;background:var(--blue-soft);color:var(--blue);font-size:13px;font-weight:600}
.chip.plain{background:var(--card);border:1px solid var(--line);color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,2.4vw,24px)}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.section-h{font-size:22px;margin:36px 0 14px}
.section-h:first-child{margin-top:0}

/* ---------- home ---------- */
.hero{padding:clamp(8px,3vw,28px) 0 24px;max-width:720px}
.hero h1{font-size:clamp(34px,6.4vw,58px)}
.hero p{margin-top:16px;font-size:18px;color:var(--muted);max-width:56ch}
.drop{display:block;border:2px dashed var(--edge);border-radius:14px;padding:clamp(26px,5vw,48px) 20px;text-align:center;background:var(--card);
  transition:background .15s,border-color .15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop strong{display:block;font:700 22px var(--serif)}
.drop span{display:block;margin-top:6px;color:var(--muted)}
.drop svg{width:40px;height:40px;color:var(--blue);margin-bottom:10px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:620px){.options{grid-template-columns:1fr}}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--edge);background:var(--card)}
.field textarea{min-height:140px;resize:vertical}
.field small{display:block;margin-top:6px;color:var(--muted);font-size:13px}
details.paste{margin-top:14px}
details.paste summary{cursor:pointer;color:var(--blue);font-weight:600;padding:6px 0}
.notice{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--mark);color:var(--mark-ink);font-size:15px}
.notice button{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;color:inherit}
.lib{display:grid;gap:10px}
.lib-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--edge);border-radius:10px;background:var(--card);text-align:left;width:100%}
.lib-item:hover{border-color:var(--blue)}
.lib-item b{display:block;font-family:var(--serif);font-size:17px;line-height:1.25}
.lib-item span{font-size:13px;color:var(--muted)}
.lib-item .grow{flex:1;min-width:0}

/* ---------- loading ---------- */
.loading{max-width:560px;margin:6vh auto 0}
.loading h2{font-size:30px}
.steps{list-style:none;padding:0;margin:26px 0 0}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--muted);border-bottom:1px solid var(--line)}
.steps li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:13px}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now i{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--ink)}
.steps li.done i{background:var(--good);border-color:var(--good);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- progress / live preview ---------- */
.prog{margin-top:22px}
.prog .bar{height:10px}
.prog .bar>i{background:var(--blue);transition:width .4s ease-out}
.prog-meta{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.live{margin-top:26px;padding:16px 18px;border-left:5px solid var(--mark);background:var(--card);border-radius:0 10px 10px 0}
.live b{font-family:var(--serif);font-size:19px;display:block}
.live p{margin-top:8px;font:400 17px/1.5 var(--serif)}
.live small{display:block;color:var(--muted);margin-bottom:6px}
.sample{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:-8px 0 22px;padding:12px 16px;border-radius:10px;background:var(--mark);color:var(--mark-ink);font-size:15px}
.sample .grow{flex:1;min-width:200px}
.sample .btn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.disclaimer{margin-top:28px;font-size:13.5px;color:var(--muted);max-width:60ch}
.findings .pgc{margin-left:6px}
.look{font-size:14.5px;padding:10px 12px;border-radius:8px;background:var(--blue-soft)}
.look b{font-weight:700}
.next-step{margin-top:36px;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.next-step h3{font-size:20px;margin-bottom:4px}

/* ---------- overview ---------- */
.paper-head h1{font-size:clamp(28px,4.6vw,42px);max-width:30ch}
.paper-head .meta{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paper-head .authors{margin-top:10px;color:var(--muted)}
.tldr{font:400 clamp(20px,2.6vw,25px)/1.5 var(--serif);margin-top:26px;max-width:46ch}
.snap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:26px}
.snap div{background:var(--card);padding:14px 16px}
.snap dt{font-size:13px;color:var(--muted);font-weight:600}
.snap dd{margin:4px 0 0;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.two{grid-template-columns:1fr}}
.card h3{font-size:19px;margin-bottom:8px}
.findings{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.findings li{padding-left:18px;border-left:4px solid var(--mark);font-size:17px}
.plain{background:var(--blue-soft);border-color:transparent}
.plain p{font-size:17px}
.limits{margin:0;padding-left:20px}
.limits li+li{margin-top:6px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gloss div{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.gloss b{font-family:var(--serif)}
.gloss p{font-size:14.5px;color:var(--muted);margin-top:2px}
.readif{margin-top:28px;font-size:15px;color:var(--muted)}

/* ---------- figures ---------- */
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:18px}
.fig{display:flex;flex-direction:column;padding:0;overflow:hidden}
.fig-img{position:relative;min-height:150px;background:var(--bg);border-bottom:1px solid var(--line);overflow:hidden;display:grid;place-items:center;width:100%;border-left:0;border-right:0;border-top:0;padding:0}
.fig-img img{width:100%;height:auto;max-height:420px;object-fit:contain;display:block;background:#fff}
.fig-img .ph{color:var(--muted);font-size:14px;padding:18px;text-align:center}
.fig-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.fig-body h3{font-size:19px}
.fig-body .why{font-size:15px;color:var(--muted)}
.fig-body .take{font-weight:600;font-size:15.5px}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(8,12,24,.86);display:grid;place-items:center;padding:20px}
.lightbox img{max-width:min(960px,100%);max-height:100%;border-radius:8px;background:#fff}
.lightbox button{position:absolute;top:14px;right:14px}

/* ---------- mind map ---------- */
.mm-wrap{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.mm-bar{display:flex;gap:6px;flex-wrap:wrap;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.mm-bar .grow{flex:1}
#mm{display:block;width:100%;height:min(66vh,620px);touch-action:none;cursor:grab;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
#mm:active{cursor:grabbing}
.mm-note{padding:12px 16px;border-top:1px solid var(--line);min-height:56px;font-size:15px}
.mm-note b{font-family:var(--serif)}

/* ---------- flashcards ---------- */
.fc-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fc-top .grow{flex:1}
.pill{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--edge);background:var(--card);font-size:14px;font-weight:600;color:var(--muted)}
.pill[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.fc-stage{perspective:1400px;margin:22px auto 0;max-width:640px}
.fc{position:relative;width:100%;height:clamp(280px,46vh,380px);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);background:var(--card);
  padding:26px;display:flex;flex-direction:column;justify-content:center;box-shadow:6px 6px 0 var(--line)}
.face .tag{position:absolute;top:16px;left:20px;font-size:13px;font-weight:600;color:var(--muted)}
.face .hint{position:absolute;bottom:14px;right:20px;font-size:13px;color:var(--muted)}
.face.front{font:600 clamp(20px,3vw,26px)/1.35 var(--serif)}
.face.back{transform:rotateY(180deg);font-size:clamp(17px,2.4vw,20px);line-height:1.5;background:var(--blue-soft);border-color:transparent;box-shadow:6px 6px 0 var(--mark)}
.fc-act{display:flex;gap:10px;justify-content:center;margin-top:28px}
.fc-act{flex-wrap:wrap}
.fc-act .btn{min-width:120px}
.btn.hard{color:var(--ink)}
.btn.again{color:var(--bad)}
.btn.got{color:var(--good)}
.keys{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
.done{text-align:center;padding:50px 20px}
.done h2{font-size:32px}
.done p{margin:10px 0 22px;color:var(--muted)}

/* ---------- games ---------- */
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.game-tile{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px;min-height:190px;transition:transform .12s,border-color .12s}
.game-tile:hover{border-color:var(--blue);transform:translateY(-2px)}
.game-tile h3{font-size:22px}
.game-tile p{color:var(--muted);font-size:15px;flex:1}
.game-tile .best{font-size:13px;font-weight:600}
.game-tile[disabled]{opacity:.5;pointer-events:none}
.hud{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-weight:600}
.hud .grow{flex:1}
.hearts{color:var(--bad);letter-spacing:2px;font-size:20px}
.hearts .off{color:var(--line)}
.timer{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
.timer>i{display:block;height:100%;width:100%;background:var(--blue);transition:width .1s linear}
.timer>i.low{background:var(--bad)}
.q{font:600 clamp(21px,3.2vw,28px)/1.3 var(--serif);margin-bottom:20px;max-width:34ch}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:10px;border:1.5px solid var(--edge);background:var(--card);font-size:16.5px;transition:border-color .1s,background .1s}
.opt:hover{border-color:var(--blue)}
.opt kbd{flex:none;width:26px;height:26px;border-radius:6px;background:var(--bg);display:grid;place-items:center;font:600 13px var(--sans);color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-weight:800;font-size:18px;line-height:1.2;padding-left:8px}
.opt.right .mk{color:var(--good)}.opt.wrong .mk{color:var(--bad)}
.opt.dim{opacity:.55}
.opts.tf{grid-template-columns:1fr 1fr}
.opts.tf .opt{justify-content:center;font:700 22px var(--serif);padding:24px}
.explain{margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--card);border-left:5px solid var(--mark)}
.explain p+p{margin-top:12px}
.score-big{font:700 clamp(54px,12vw,96px)/1 var(--serif)}
.match-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:760px){.match-grid{grid-template-columns:repeat(4,1fr)}}
.mcard{min-height:92px;padding:12px;border-radius:10px;border:1.5px solid var(--edge);background:var(--card);font-size:15px;line-height:1.35;display:grid;place-items:center;text-align:center;transition:opacity .3s,transform .15s}
.mcard.term{font:700 17px var(--serif)}
.mcard.sel{border-color:var(--blue);background:var(--blue-soft);transform:scale(1.03)}
.mcard.gone{opacity:0;pointer-events:none;transform:scale(.9)}
.mcard.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- chat ---------- */
.msgs{display:flex;flex-direction:column;gap:14px;margin:18px 0 12px;min-height:120px}
.msg{display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:min(680px,92%);padding:12px 16px;border-radius:14px;line-height:1.55;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--ink);color:var(--bg);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.ai .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble p+p,.bubble ul+p,.bubble p+ul,.bubble ol+p,.bubble p+ol{margin-top:10px}
.bubble ul,.bubble ol{margin:0;padding-left:22px}
.bubble li+li{margin-top:4px}
.bubble code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--bg);padding:1px 5px;border-radius:4px}
.pgc{border:0;background:var(--mark);color:var(--mark-ink);font-size:13px;font-weight:700;padding:4px 9px;min-height:28px;border-radius:6px;margin:0 2px;vertical-align:baseline}
.pgc:hover{filter:brightness(.94)}
.pgc.off{background:var(--bg);color:var(--muted);border:1px solid var(--line);cursor:default}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.starters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.starters p{width:100%}
.starters .pill{text-align:left;color:var(--ink)}
.starters .pill:hover{border-color:var(--blue)}
.composer{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;min-height:44px;max-height:160px;padding:10px 14px;border-radius:12px;border:1px solid var(--edge);background:var(--card);line-height:1.4}
.composer .btn{min-height:44px}
.bubble.bad{border-color:var(--bad)}

/* ---------- modal & toast ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,12,24,.55);display:grid;place-items:center;padding:16px}
.modal{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:14px;padding:24px;border:1px solid var(--line)}
.modal h2{font-size:24px;margin-bottom:6px}
.modal .field{margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;max-width:90vw}
.err{max-width:560px;margin:8vh auto 0}
.err h2{font-size:28px}
.err p{margin:12px 0 22px;color:var(--muted)}

@media (pointer:coarse){.btn.small,.pill{min-height:44px}.tab{padding:15px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- appearance picker ---------- */
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;min-height:44px;padding:0 20px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--edge)}
.seg button[aria-checked=true]{background:var(--ink);color:var(--bg)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.theme{display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px;border-radius:12px;border:1.5px solid var(--edge);background:var(--card);min-height:96px}
.theme:hover{border-color:var(--blue)}
.theme[aria-checked=true]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.theme .dots{display:flex}
.theme .dots i{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);margin-right:-8px;box-shadow:0 0 0 1px var(--line)}
.theme b{font-family:var(--serif);font-size:16px}
.theme small{color:var(--muted);font-size:13px;line-height:1.3}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--blue)}
.check small{display:block;color:var(--muted);font-size:13.5px}
.logo-mark{fill:var(--mark)}

.unv{margin-top:34px;padding:14px 18px;border:1px dashed var(--edge);border-radius:12px}
.unv summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}

.site-foot{max-width:1000px;margin:0 auto;padding:8px clamp(14px,3vw,28px) 36px;text-align:center;font-size:13px;color:var(--muted)}

/* ---------- library ---------- */
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:8px;padding:0 6px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700}
.count:empty{display:none}
.lib-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.lib-list{display:grid;gap:14px}
.libc{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.libc-main{flex:1;min-width:240px}
.libc-main h3{font-size:20px;margin:0}
.linklike{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.linklike:hover{text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:3px}
.libc-meta{font-size:13.5px;margin-top:8px}
.libc-prog{margin-top:12px;max-width:440px}
.libc-prog span{display:block;margin-top:6px;font-size:13.5px;color:var(--muted)}
.libc-act{display:flex;gap:6px;flex-wrap:wrap}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.lib-data{margin-top:30px}
.lib-data h3{font-size:19px;margin-bottom:6px}
@media (max-width:520px){#btn-lib{padding:0 10px}}

@media (max-width:420px){.brand-t{display:none}.top{gap:4px}.icon-btn{width:40px}}

  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function teardown() { S.cleanups.forEach(f => { try { f(); } catch (e) {} }); S.cleanups = []; S.keys = null; }
function download(name, text, type) {
  const blob = text instanceof Blob ? text : new Blob([text], { type: type || 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const slug = s => String(s || 'paper').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'paper';
document.addEventListener('keydown', e => {
  if (e.target.closest?.('input,textarea,select')) return;
  if ($('.scrim') || $('.lightbox')) { if (e.key === 'Escape') { $('.scrim')?.remove(); $('.lightbox')?.remove(); } return; }
  if (S.keys) S.keys(e);
});

/* ---------- PDF page rendering (pdf.js loaded on demand) ---------- */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function ensurePdfJs() {
  if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions.workerSrc) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js';
    s.onload = async () => { try { const r = await fetch(PDFJS + 'pdf.worker.min.js'); pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(await r.blob()); res(); } catch (e) { rej(e); } };
    s.onerror = () => rej(new Error('pdf.js could not be loaded'));
    document.head.appendChild(s);
  });
}
function attachPdf(file) {
  S.srcFile = file; S.srcText = null; S.pdf = null; S.pageImgs = {}; S.figCache = new Map(); figCanvases.clear();
  S.pdfReady = (async () => {
    try { await ensurePdfJs(); S.pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; }
    catch (e) { console.warn('Page previews unavailable:', e); S.pdf = null; }
  })();
  return S.pdfReady;
}
async function getPageImg(n) {
  await S.pdfReady;
  if (!S.pdf || !n || n < 1 || n > S.pdf.numPages) return null;
  if (S.pageImgs[n]) return S.pageImgs[n];
  try {
    const page = await S.pdf.getPage(n), vp = page.getViewport({ scale: 1.6 });
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    return (S.pageImgs[n] = c.toDataURL('image/jpeg', 0.88));
  } catch (e) { console.warn(e); return null; }
}

/* ---------- analysis: prompt ---------- */
const AUDIENCES = {
  adjacent: 'a researcher from a neighbouring field: define specialist terms briefly and keep the rigour',
  expert: 'a specialist in this exact field: be technical and precise, no hand-holding',
  newcomer: 'a curious newcomer: use plain language and short everyday analogies, define every technical term'
};
function buildSystem(aud) {
  return `You are Paperlens, an expert analyst who helps researchers in any field grasp a paper fast. Read the paper carefully and respond with ONE JSON object and nothing else: no prose before or after, no code fences.

Accuracy rules: only state what the paper supports. Quote numbers exactly as the paper reports them. If the paper does not say something, leave it out rather than guess. Write in plain text only: no markdown, no LaTeX; use unicode for symbols (α, ², ≈, √).
Audience: ${AUDIENCES[aud] || AUDIENCES.adjacent}.
Be concise and specific. Prefer concrete facts, numbers and names over general statements.

JSON schema (keys in this exact order):
{
 "meta": { "title": str, "authors": str (short, e.g. "Vaswani et al."), "venue_year": str or "", "field": str, "paper_type": str (e.g. "Randomised trial", "Method paper", "Review", "Theory"), "one_liner": str (max 25 words) },
 "overview": {
   "tldr": str (2 to 3 sentences, the whole paper in brief),
   "plain_english": str (3 to 4 sentences, no jargon),
   "problem": str (1 to 2 sentences: the gap or question),
   "approach": str (1 to 3 sentences: what they did),
   "key_findings": [3 to 5 {"text": str (one sentence, include numbers), "page": integer or null (1-based PDF page where the paper states it, counting from the first page of the PDF file and NOT the printed page number)}],
   "why_it_matters": str (1 to 2 sentences),
   "limitations": [2 to 4 strings, caveats stated by authors or evident from the design],
   "read_if": str (one sentence: who should read the full paper and why),
   "snapshot": [4 to 6 {"label": str, "value": str}] such as Study type, Sample or data, Method, Main result, Setting
 },
 "glossary": [5 to 8 {"term": str, "definition": str (max 20 words)}],
 "figures": [up to 6 of the most important figures, tables, diagrams or algorithm boxes, in order of appearance. ONLY include items that have a numbered caption printed in the paper (such as "Figure 2", "Fig. 3", "Table 1", "Algorithm 1"). Never list ordinary text, paragraphs, headings, bullet lists or equations, and never invent an item; if the paper has fewer than 3 captioned items, list fewer.
   {"label": str (exactly as printed in the caption, e.g. "Figure 2" or "Table 1"), "caption_start": str (the first 8 words of that caption, copied exactly), "pdf_page": integer (1-based index of the PDF page where the caption appears, counting from the first page of the PDF file and NOT the printed page number; null if unknown), "kind": "figure"|"table"|"diagram"|"algorithm", "title": str, "what_it_shows": str (1 to 2 sentences), "why_it_matters": str (1 sentence), "takeaway": str (max 15 words), "check": str (one thing a critical reader should scrutinize in this item, such as axes, error bars, sample size or baselines; max 20 words)}],
 "mindmap": { "label": str (short paper name, max 5 words), "children": [5 to 7 branches such as Problem, Method, Data, Results, Implications, Limitations; each {"label": str (max 6 words), "note": str (optional, one sentence of detail), "children": [2 to 4 items, each optionally with 1 to 3 children of its own]}] },
 "flashcards": [16 to 22 {"front": str (a question or term), "back": str (answer in 1 to 3 sentences), "type": "concept"|"method"|"result"|"term"|"critique", "difficulty": 1|2|3}] mixing all five types, covering the paper's logic from start to finish,
 "games": {
   "quiz": [10 multiple-choice questions {"question": str, "options": [exactly 4 plausible strings], "answer_index": 0 to 3 (vary position), "explanation": str (1 to 2 sentences)}] about understanding, not trivia; wrong options must be plausible,
   "fact_or_fiction": [12 {"statement": str, "is_true": bool, "explanation": str}] with about half false; false statements should be subtle but clearly wrong according to the paper,
   "match": [exactly 6 {"term": str (max 4 words), "definition": str (max 8 words)}] of the paper's key concepts
 }
}`;
}

/* ---------- analysis: run ---------- */
const STAGES = [
  ['"meta"', 'Reading the paper'], ['"overview"', 'Writing the overview'], ['"figures"', 'Finding the key figures'],
  ['"mindmap"', 'Drawing the mind map'], ['"flashcards"', 'Making flashcards'], ['"games"', 'Building the games']
];
function fileToB64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Could not read that file.')); r.readAsDataURL(file); });
}
function friendlyError(status, msg) {
  if (status === 400 && /workspace/i.test(msg)) return 'Your key isn\'t tied to a workspace. Either create a new key inside a named workspace in the Anthropic console, or add that workspace\'s ID (starts with wrkspc_) in Settings.';
  if (status === 401) return 'The API key was rejected. Open Settings and check that it is correct.';
  if (status === 403) return 'This key is not allowed to use that model or feature. ' + msg;
  if (status === 404) return 'That model name was not found. Open Settings and pick a valid model. ' + msg;
  if (status === 413) return 'The file is too large for the API. Try a smaller PDF (under about 24 MB and 100 pages).';
  if (status === 429) return 'Rate limit reached. Wait a minute and try again.';
  if (status === 529 || status >= 500) return 'The API is busy right now. Try again in a moment.';
  return msg || ('Request failed (' + status + ').');
}
function parseModelJSON(text) {
  let t = text.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('The model did not return structured data.');
  return JSON.parse(t.slice(a, b + 1));
}

/* ---------- shared: stream a Messages API call ---------- */
async function streamMessages({ system, messages, max_tokens, onText, signal }) {
  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal,
      headers: Object.assign({ 'content-type': 'application/json', 'x-api-key': S.settings.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, S.settings.workspace ? { 'anthropic-workspace-id': S.settings.workspace } : {}),
      body: JSON.stringify({ model: S.settings.model, max_tokens, stream: true, system, messages })
    });
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    throw new Error('Could not reach api.anthropic.com. Check your connection and any ad or privacy blockers.');
  }
  if (!res.ok) { let m = ''; try { m = (await res.json()).error?.message || ''; } catch (e) {} throw new Error(friendlyError(res.status, m)); }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '', stop = '';
  for (;;) {
    const { done, value } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      const d = line.slice(5).trim(); if (!d) continue;
      let ev; try { ev = JSON.parse(d); } catch (e) { continue; }
      if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { text += ev.delta.text; onText && onText(text); }
      else if (ev.type === 'message_delta' && ev.delta?.stop_reason) stop = ev.delta.stop_reason;
      else if (ev.type === 'error') throw new Error(ev.error?.message || 'The stream was interrupted.');
    }
  }
  return { text, stop };
}

async function analyze(src) {
  if (!S.settings.key) { openSettings('Add your Anthropic API key to analyze a paper.'); return; }
  S.lastSrc = src; S.view = 'loading'; teardown();
  const label = src.pdf ? src.pdf.name : 'pasted text';
  showLoading(label);
  const ctrl = S.abort = new AbortController();
  try {
    const content = [];
    if (src.pdf) {
      if (src.pdf.size > 24 * 1024 * 1024) throw new Error('That PDF is larger than 24 MB. Try a smaller or compressed copy.');
      content.push({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: await blobToB64(src.pdf) } });
      attachPdf(src.pdf);
    } else {
      S.srcFile = null; S.srcText = src.text; S.pdf = null; S.pageImgs = {}; S.pdfReady = Promise.resolve();
      content.push({ type: 'text', text: 'PAPER TEXT:\n\n' + src.text.slice(0, 450000) });
    }
    content.push({ type: 'text', text: 'Analyze this paper and return the JSON object described in your instructions.' });

    const { text, stop } = await streamMessages({ system: buildSystem(S.settings.audience), messages: [{ role: 'user', content }], max_tokens: 16000, onText: updateStages, signal: ctrl.signal });
    let data;
    try { data = parseModelJSON(text); }
    catch (e) { throw new Error(stop === 'max_tokens' ? 'The analysis was cut off because the paper is very dense. Try again or choose a faster model.' : 'The response could not be read. Try again.'); }
    const paper = normalize(data);
    paper.id = 'p' + Date.now().toString(36);
    try { await saveToLibrary(paper, src); } catch (e) { console.warn(e); toast('Could not save to your library (storage may be full)'); }
    S.abort = null; S.paper = paper; updateStages(text, true);
    setTimeout(() => showPaper('overview'), 350);
  } catch (e) {
    S.abort = null;
    if (e.name === 'AbortError') { showHome(); return; }
    showError(e.message || String(e));
  }
}

function normalize(d) {
  const m = d.meta || {}, o = d.overview || {}, g = d.games || {};
  const title = m.title || 'Untitled paper';
  return {
    meta: { title, authors: m.authors || '', venue: m.venue_year || '', field: m.field || '', type: m.paper_type || '', oneLiner: m.one_liner || '' },
    ov: {
      tldr: o.tldr || m.one_liner || '', plain: o.plain_english || '', problem: o.problem || '', approach: o.approach || '',
      findings: arr(o.key_findings).map(f => typeof f === 'string' ? { t: f, p: null } : { t: f?.text || '', p: Number.isInteger(f?.page) ? f.page : null }).filter(f => f.t), why: o.why_it_matters || '', limits: arr(o.limitations).filter(Boolean),
      readIf: o.read_if || '', snapshot: arr(o.snapshot).filter(x => x && x.label && x.value)
    },
    glossary: arr(d.glossary).filter(x => x && x.term && x.definition),
    figures: arr(d.figures).filter(f => f && (f.title || f.label)),
    mindmap: d.mindmap && d.mindmap.label ? d.mindmap : { label: title, children: [] },
    cards: arr(d.flashcards).filter(c => c && c.front && c.back),
    quiz: arr(g.quiz).filter(q => q && q.question && arr(q.options).length >= 2 && Number.isInteger(q.answer_index) && q.answer_index < q.options.length),
    fof: arr(g.fact_or_fiction).filter(f => f && f.statement && typeof f.is_true === 'boolean'),
    match: arr(g.match).filter(p => p && p.term && p.definition).slice(0, 6)
  };
}

/* ---------- screens: loading & error ---------- */
const EXPECT_CHARS = 17000;
function showLoading(label) {
  $('#tabs').hidden = true; S.progress = 0; S.t0 = Date.now();
  app().innerHTML = `<div class="loading"><h2>Reading ${esc(label)}</h2>
    <p class="muted" style="margin-top:8px">Most papers take 30 to 90 seconds. The overview appears below as soon as it's written.</p>
    <div class="prog"><div class="bar" role="progressbar" aria-label="Analysis progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="pbar" style="width:2%"></i></div>
      <div class="prog-meta"><span id="ptxt">Starting…</span><span id="eta"></span></div></div>
    <div id="live" class="live" hidden><small>First look</small><b id="live-t"></b><p id="live-s"></p></div>
    <ol class="steps" id="steps">${STAGES.map((s, i) => `<li data-i="${i}" class="${i === 0 ? 'now' : ''}"><i></i>${s[1]}</li>`).join('')}</ol>
    <button class="btn ghost" id="cancel" style="margin-top:22px">Cancel</button></div>`;
  $('#cancel').onclick = () => S.abort?.abort();
  const tick = setInterval(() => {
    if (!$('#eta')) return clearInterval(tick);
    const el = (Date.now() - S.t0) / 1000, p = S.progress;
    const m = Math.floor(el / 60), s = Math.floor(el % 60);
    let eta = m + ':' + String(s).padStart(2, '0') + ' elapsed';
    if (p > 12 && p < 99 && el > 8) { const left = Math.max(5, Math.round(el * (100 - p) / p / 5) * 5); eta += ' · about ' + left + ' s left'; }
    $('#eta').textContent = eta;
  }, 500);
  S.cleanups.push(() => clearInterval(tick));
}
function jsonStr(raw) { try { return JSON.parse('"' + raw.replace(/\\$/, '') + '"'); } catch (e) { return raw; } }
function updateStages(text, all) {
  let cur = 0;
  STAGES.forEach((s, i) => { if (new RegExp(s[0] + '\\s*:').test(text)) cur = i; });
  $$('#steps li').forEach((li, i) => { li.className = all || i < cur ? 'done' : i === cur ? 'now' : ''; if (li.className === 'done') li.firstChild.textContent = '✓'; });
  const pct = all ? 100 : Math.max(S.progress || 0, Math.min(96, text.length / EXPECT_CHARS * 100));
  S.progress = pct;
  const bar = $('#pbar'); if (bar) { bar.style.width = Math.max(2, pct) + '%'; bar.parentElement.setAttribute('aria-valuenow', Math.round(pct)); }
  const t = $('#ptxt'); if (t) t.textContent = all ? 'Done' : STAGES[cur][1] + '… ' + Math.round(pct) + '%';
  const title = /"title"\s*:\s*"((?:[^"\\]|\\.)*)"/.exec(text), tl = /"tldr"\s*:\s*"((?:[^"\\]|\\.)*)/.exec(text);
  if (title && $('#live')) { $('#live').hidden = false; $('#live-t').textContent = jsonStr(title[1]); $('#live-s').textContent = tl ? jsonStr(tl[1]) : ''; }
}
function showError(msg) {
  $('#tabs').hidden = true;
  app().innerHTML = `<div class="err"><h2>That didn't work</h2><p>${esc(msg)}</p>
    <div class="row"><button class="btn primary" id="retry" ${S.lastSrc ? '' : 'hidden'}>Try again</button><button class="btn" id="set">Open settings</button><button class="btn ghost" id="home">Back</button></div></div>`;

function toMarkdown(p) {
  const o = p.ov, m = p.meta, L = [];
  L.push('# ' + m.title); if (m.authors) L.push('*' + m.authors + (m.venue ? ' (' + m.venue + ')' : '') + '*');
  if (o.tldr) L.push('', '**TL;DR:** ' + o.tldr);
  if (o.snapshot.length) { L.push('', '## At a glance'); o.snapshot.forEach(s => L.push('- **' + s.label + ':** ' + s.value)); }
  if (o.problem) L.push('', '## Problem', o.problem); if (o.approach) L.push('', '## Approach', o.approach);
  if (o.findings.length) { L.push('', '## Key findings'); o.findings.forEach(f => L.push('- ' + f.t + (f.p ? ' (PDF p.' + f.p + ')' : ''))); }
  if (o.plain) L.push('', '## In plain English', o.plain); if (o.why) L.push('', '## Why it matters', o.why);
  if (o.limits.length) { L.push('', '## Caveats'); o.limits.forEach(f => L.push('- ' + f)); }
  if (p.figures.length) { L.push('', '## Key figures'); p.figures.forEach(f => L.push('- **' + (f.label || '') + ((f.loc?.page || f.pdf_page) ? ' (PDF p.' + (f.loc?.page || f.pdf_page) + ')' : '') + ' ' + (f.title || '') + ':** ' + (f.what_it_shows || '') + ' ' + (f.takeaway ? 'Takeaway: ' + f.takeaway : ''))); }
  if (p.glossary.length) { L.push('', '## Glossary'); p.glossary.forEach(g => L.push('- **' + g.term + ':** ' + g.definition)); }
  return L.join('\n') + '\n';
}

function openLightbox(url, alt) {

/* =====================================================================
   Paperlens — chat with the paper
   ===================================================================== */
const CHAT_STARTERS = [
  'Explain the main result as if I have 2 minutes',
  'What are the weakest points of this study?',
  'Walk me through the methods step by step',
  'What would I need to replicate this?',
  'What should I read next to follow up on this?'
];
const PAGE_RE = /\(pp?\.\s*(\d+)[^)]*\)/g;

function chatSystem(mode) {
  const src = mode === 'pdf' ? 'The full paper is attached to the first message as a PDF.'
    : mode === 'text' ? 'The full text of the paper is in the first message.'
    : 'You only have saved notes about the paper (summary, figures, glossary), not the full text. Say so when a question needs detail the notes do not contain.';
  const cite = mode === 'pdf' ? '\nWhen you rely on a specific part, cite the PDF page like (p. 4). Count pages from the first page of the PDF file, not the printed page number.' : '';
  return `You are Paperlens, a research assistant answering questions about ONE paper. ${src}

Ground every answer in the paper. If the paper does not say, state that plainly; you may then add general knowledge, clearly labelled as coming from outside the paper. Quote numbers exactly as the paper reports them, and never invent citations or results.
Lead with the answer, then give the support. Be concise unless asked for depth.${cite}
Format: short paragraphs, "-" bullets when useful, **bold** sparingly. No headings, no tables, no LaTeX; use unicode for symbols.
Audience: ${AUDIENCES[S.settings.audience] || AUDIENCES.adjacent}.`;
}
async function chatSourceBlock() {
  const cc = { type: 'ephemeral' };
  if (S.srcFile) {
    if (!S.srcCache || S.srcCache.f !== S.srcFile) S.srcCache = { f: S.srcFile, b: await blobToB64(S.srcFile) };
    return { mode: 'pdf', block: { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: S.srcCache.b }, cache_control: cc } };
  }
  if (S.srcText) return { mode: 'text', block: { type: 'text', text: 'PAPER TEXT:\n\n' + S.srcText.slice(0, 450000), cache_control: cc } };
  const p = S.paper, gl = p.glossary.map(g => '- ' + g.term + ': ' + g.definition).join('\n');
  return { mode: 'notes', block: { type: 'text', text: 'SAVED NOTES ABOUT THE PAPER:\n\n' + toMarkdown(p) + (gl ? '\nGlossary\n' + gl + '\n' : ''), cache_control: cc } };
}

/* tiny, safe markdown: paragraphs, bullets, numbered lists, bold, code, page chips */
function mdLite(text) {
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(PAGE_RE, (m, n) => `<button class="pgc" data-pg="${n}">${m.slice(1, -1)}</button>`);
  return esc(text).split(/\n{2,}/).map(b => {
    const lines = b.split('\n').filter(l => l.trim());
    if (!lines.length) return '';
    if (lines.every(l => /^\s*[-*•]\s+/.test(l))) return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*•]\s+/, '')) + '</li>').join('') + '</ul>';
    if (lines.every(l => /^\s*\d+[.)]\s+/.test(l))) return '<ol>' + lines.map(l => '<li>' + inline(l.replace(/^\s*\d+[.)]\s+/, '')) + '</li>').join('') + '</ol>';
    return '<p>' + lines.map(l => inline(l.replace(/^#+\s*(.*)$/, '<b>$1</b>'))).join('<br>') + '</p>';
  }).join('');
}

function viewChat(p) {
  const keep = p.id && p.id !== 'demo';
  const chat = S.chats[p.id] || (S.chats[p.id] = { msgs: keep ? arr(ls.get(chatKey(p.id), [])).filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string' && m.content) : [] });
  const saveChat = () => { if (keep) { const m = chat.msgs.filter(x => x.content).slice(-40); m.length ? ls.set(chatKey(p.id), m) : ls.del(chatKey(p.id)); } };
  const hasSrc = !!(S.srcFile || S.srcText);
  let ctrl = null, draft = '';
  S.cleanups.push(() => ctrl?.abort());

  app().innerHTML = `
  <div class="chat">
    <div class="row" style="justify-content:space-between;align-items:flex-start;margin-bottom:6px">
      <div><h2 style="font-size:26px">Ask the paper</h2>
      <p class="muted" style="margin-top:4px">${hasSrc ? 'Answers come from the full paper. Page references open the page.' : 'Answering from the saved notes only, so fine detail may be missing.'}</p></div>
      <button class="btn small ghost" id="clear" ${chat.msgs.length ? '' : 'hidden'}>Clear chat</button>
    </div>
    ${hasSrc ? '' : `<div class="notice" style="margin:12px 0 0">Want answers from the whole paper? <label style="text-decoration:underline;font-weight:700;cursor:pointer">Attach the PDF<input type="file" accept=".pdf" id="chat-att" class="sr"></label></div>`}
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="starters" id="starters"></div>
    <div class="composer"><textarea id="q" rows="1" placeholder="Ask anything about this paper…" aria-label="Your question"></textarea>
      <button class="btn primary" id="send">Send</button><button class="btn" id="stop" hidden>Stop</button></div>
  </div>`;

  const msgsEl = $('#msgs'), q = $('#q');
  const paint = () => {
    msgsEl.innerHTML = chat.msgs.map((m, i) => m.role === 'user'
      ? `<div class="msg user"><div class="bubble">${esc(m.content)}</div></div>`
      : `<div class="msg ai"><div class="bubble ${m.error ? 'bad' : ''}" data-i="${i}">${m.content ? mdLite(m.content) : '<span class="typing"><i></i><i></i><i></i></span>'}</div></div>`).join('');
    $('#starters').innerHTML = chat.msgs.length ? '' : `<p class="muted" style="margin-bottom:8px">Try one of these</p>` + CHAT_STARTERS.map(s => `<button class="pill" data-s="${esc(s)}">${esc(s)}</button>`).join('');
    $('#clear').hidden = !chat.msgs.length;
    $$('[data-s]').forEach(b => b.onclick = () => send(b.dataset.s));
  };
  const nearBottom = () => innerHeight + scrollY >= document.documentElement.scrollHeight - 160;
  const busy = on => { $('#send') && ($('#send').hidden = on); $('#stop') && ($('#stop').hidden = !on); q && (q.disabled = on); };

  async function send(text) {
    text = (text ?? q.value).trim(); if (!text || ctrl) return;
    if (!S.settings.key) { openSettings('Add your Anthropic API key to chat with the paper.'); return; }
    q.value = ''; q.style.height = 'auto';
    chat.msgs.push({ role: 'user', content: text }, { role: 'assistant', content: '' });
    paint(); busy(true); scrollTo({ top: document.documentElement.scrollHeight });
    ctrl = new AbortController();
    const mine = ctrl, reply = chat.msgs[chat.msgs.length - 1];
    try {
      const { mode, block } = await chatSourceBlock();
      const hist = chat.msgs.slice(0, -1).map(m => ({ role: m.role, content: m.content }));
      hist[0] = { role: 'user', content: [block, { type: 'text', text: hist[0].content }] };
      await streamMessages({
        system: chatSystem(mode), messages: hist, max_tokens: 2500, signal: mine.signal,
        onText: t => {
          reply.content = t; const el = $(`.bubble[data-i="${chat.msgs.length - 1}"]`); if (!el) return;
          const follow = nearBottom(); el.innerHTML = mdLite(t); if (follow) scrollTo({ top: document.documentElement.scrollHeight });
        }
      });
    } catch (e) {
      const aborted = e.name === 'AbortError';
      if (!(aborted && reply.content)) {            // keep a partial answer, drop anything empty or failed
        const i = chat.msgs.indexOf(reply); if (i > 0) chat.msgs.splice(i - 1, 2);
        draft = text;
        if (!aborted && $('#q')) toast(e.message || 'Something went wrong');
      }
    } finally {
      ctrl = null; saveChat();
      if ($('#msgs')) { paint(); busy(false); const qq = $('#q'); if (draft) { qq.value = draft; draft = ''; } qq.focus(); }
    }
  }

  $('#send').onclick = () => send();
  $('#stop').onclick = () => ctrl?.abort();
  $('#clear').onclick = () => { chat.msgs.length = 0; saveChat(); paint(); };
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 160) + 'px'; });
  $('#chat-att')?.addEventListener('change', e => { const f = e.target.files[0]; if (f) { attachPdf(f); toast('PDF attached'); viewChat(p); } });
  paint();
}

/* =====================================================================
   Paperlens — your library.
   Lives in this browser on this device only: no account, no server.
   Papers + saved PDFs go in IndexedDB; if that's unavailable (some private
   modes) we fall back to localStorage, notes only.
   ===================================================================== */
let _idb = null, _mode = null;
function idbOpen() {
  if (_idb) return _idb;
  _idb = new Promise((res, rej) => {
    try {
      if (!window.indexedDB) throw new Error('IndexedDB unavailable');
      const r = indexedDB.open('paperlens', 1);
      r.onupgradeneeded = () => { const d = r.result; ['papers', 'sources'].forEach(n => d.objectStoreNames.contains(n) || d.createObjectStore(n, { keyPath: 'id' })); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error || new Error('IndexedDB error')); r.onblocked = () => rej(new Error('IndexedDB blocked'));
    } catch (e) { rej(e); }
  });
  return _idb;
}
const libMode = () => _mode ? Promise.resolve(_mode) : idbOpen().then(() => (_mode = 'idb'), () => (_mode = 'ls'));
const idb = (store, mode, fn) => idbOpen().then(db => new Promise((res, rej) => {
  const t = db.transaction(store, mode); let out;
  const rq = fn(t.objectStore(store)); if (rq) rq.onsuccess = () => { out = rq.result; };
  t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Storage was refused (it may be full)'));
}));
const progKey = id => 'pl.prog.' + id, chatKey = id => 'pl.chat.' + id, bestKey = (id, m) => 'pl.best.' + id + '.' + m;
const legacyRec = x => Object.assign({ added: x.date || 0, opened: x.date || 0, hasSource: null, srcName: '', srcSize: 0, authors: x.data?.meta?.authors || '', type: x.data?.meta?.type || '', venue: x.data?.meta?.venue || '' }, x);

const lib = {
  async list() {
    const rows = (await libMode()) === 'idb' ? await idb('papers', 'readonly', s => s.getAll()) : ls.get('pl.lib', []).map(legacyRec);
    return rows.sort((a, b) => (b.opened || 0) - (a.opened || 0));
  },
  async get(id) { return (await libMode()) === 'idb' ? idb('papers', 'readonly', s => s.get(id)) : ls.get('pl.lib', []).map(legacyRec).find(x => x.id === id); },
  async put(rec) {
    if ((await libMode()) === 'idb') return idb('papers', 'readwrite', s => s.put(rec));
    let a = ls.get('pl.lib', []).filter(x => x.id !== rec.id); a.unshift(rec); a = a.slice(0, 15);
    while (a.length && !ls.set('pl.lib', a)) a.pop();
  },
  async putSource(id, src) { if ((await libMode()) !== 'idb') return false; await idb('sources', 'readwrite', s => s.put(Object.assign({ id }, src))); return true; },
  async getSource(id) { return (await libMode()) === 'idb' ? idb('sources', 'readonly', s => s.get(id)) : null; },
  async removeSource(id) { if ((await libMode()) === 'idb') await idb('sources', 'readwrite', s => s.delete(id)); },
  async remove(id) {
    if ((await libMode()) === 'idb') { await idb('papers', 'readwrite', s => s.delete(id)); await idb('sources', 'readwrite', s => s.delete(id)); }
    else ls.set('pl.lib', ls.get('pl.lib', []).filter(x => x.id !== id));
    [progKey(id), chatKey(id), bestKey(id, 'quiz'), bestKey(id, 'fof'), bestKey(id, 'match')].forEach(ls.del); delete S.chats[id];
  },
  async clearAll() {

/* ---------- helpers ---------- */
function upgradePaper(p) {                                   // papers saved by older versions
  p.ov = p.ov || {}; p.ov.findings = arr(p.ov.findings).map(f => typeof f === 'string' ? { t: f, p: null } : f).filter(f => f && f.t);
  ['limits', 'snapshot'].forEach(k => p.ov[k] = arr(p.ov[k]));
  ['glossary', 'figures', 'cards', 'quiz', 'fof', 'match'].forEach(k => p[k] = arr(p[k]));
  p.mindmap = p.mindmap && p.mindmap.label ? p.mindmap : { label: p.meta.title, children: [] };
  return p;
}
const isPaper = x => !!(x && typeof x === 'object' && x.id && x.meta && typeof x.meta.title === 'string' && x.ov && Array.isArray(x.figures) && Array.isArray(x.cards));

/* ---------- save / open ---------- */
async function saveToLibrary(p, src) {
  const rec = { id: p.id, title: p.meta.title, authors: p.meta.authors, field: p.meta.field, type: p.meta.type, venue: p.meta.venue,
    added: Date.now(), opened: Date.now(), hasSource: null, srcName: '', srcSize: 0, data: p };
  if (src && S.settings.keepPdf !== false) {
    try {

}

/* ---------- backup: the no-account way to move or keep your library ---------- */
async function exportLibrary(includePdfs) {
  const items = await lib.list(), out = { app: 'paperlens', version: 1, exported: Date.now(), papers: [] };
  for (const r of items) {
    const entry = { rec: r, prog: ls.get(progKey(r.id), null), chat: ls.get(chatKey(r.id), null), best: { quiz: ls.get(bestKey(r.id, 'quiz'), null), fof: ls.get(bestKey(r.id, 'fof'), null), match: ls.get(bestKey(r.id, 'match'), null) } };
    if (includePdfs && r.hasSource) {
      try { const s = await lib.getSource(r.id); if (s?.blob) entry.pdf = await blobToB64(s.blob); else if (s?.text) entry.text = s.text; } catch (e) { console.warn(e); }
    }
    out.papers.push(entry);
  }
  download('paperlens-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(out), 'application/json');
  toast(items.length ? 'Backup downloaded' : 'Backup downloaded (your library is empty)');
}
async function importLibrary(file) {
  let data; try { data = JSON.parse(await file.text()); } catch (e) { toast('That file isn\'t a Paperlens backup'); return 0; }
  if (!data || data.app !== 'paperlens' || !Array.isArray(data.papers)) { toast('That file isn\'t a Paperlens backup'); return 0; }
  const have = new Set((await lib.list()).map(r => r.id)); let added = 0, skipped = 0;
  for (const e of data.papers) {
    const r = e && e.rec; if (!r || !r.id || !isPaper(r.data)) { skipped++; continue; }
    if (have.has(r.id)) { skipped++; continue; }
    try {
      if (e.pdf) { await lib.putSource(r.id, { blob: b64ToBlob(e.pdf) }); r.hasSource = 'pdf'; }
      else if (typeof e.text === 'string') { await lib.putSource(r.id, { text: e.text }); r.hasSource = 'text'; }
      else r.hasSource = null;
      upgradePaper(r.data); await lib.put(r);
      if (e.prog) ls.set(progKey(r.id), e.prog); if (Array.isArray(e.chat)) ls.set(chatKey(r.id), e.chat);
      ['quiz', 'fof', 'match'].forEach(m => { if (e.best && e.best[m] != null) ls.set(bestKey(r.id, m), e.best[m]); });
      added++;
    } catch (err) { console.warn(err); skipped++; }
  }
  refreshLibCount(); toast(`Restored ${added} paper${added === 1 ? '' : 's'}${skipped ? ` (${skipped} skipped: already here or unreadable)` : ''}`);
  return added;
}

/* ---------- mind map ---------- */
const branchColors = () => (PALETTES[document.documentElement.getAttribute('data-palette')] || PALETTES.paper).branch;
const mix = (hex, t) => { const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (255 - v) * t)); return '#' + c.map(v => v.toString(16).padStart(2, '0')).join(''); };
function wrapText(s, max) {
  const words = String(s).split(/\s+/), lines = []; let cur = '';
  words.forEach(w => { if (!cur) cur = w; else if ((cur + ' ' + w).length <= max) cur += ' ' + w; else { lines.push(cur); cur = w; } });
  if (cur) lines.push(cur);
  if (lines.length > 4) { lines.length = 4; lines[3] = lines[3].replace(/.{0,2}$/, '…'); }
  return lines;
}
function mmBuild(root) {
  let id = 0;
  const walk = (n, depth, branch) => {
    const node = { id: id++, label: String(n.label || '…'), note: n.note || '', depth, branch, children: [] };
    arr(n.children).forEach((c, i) => node.children.push(walk(c, depth + 1, depth === 0 ? i : branch)));
    return node;
  };
  return walk(root, 0, 0);
}
function mmLayout(root, collapsed) {
  const nodes = [], links = []; let cursor = 0; const gap = 12;
  const place = n => {
    const fs = n.depth === 0 ? 17 : n.depth === 1 ? 15 : 13.5, max = n.depth === 0 ? 16 : n.depth === 1 ? 20 : 26;
    n.fs = fs; n.lines = wrapText(n.label, max);
    n.w = Math.max(80, Math.max(...n.lines.map(l => l.length)) * fs * 0.57 + 30 + (n.children.length ? 14 : 0));
    n.h = n.lines.length * (fs + 4) + 16;

    if (!vis.length) { n.y = cursor + n.h / 2; cursor += n.h + gap; }
    else { vis.forEach(place); n.y = (vis[0].y + vis[vis.length - 1].y) / 2; }
    nodes.push(n);
  };
  place(root);
  const maxW = []; nodes.forEach(n => maxW[n.depth] = Math.max(maxW[n.depth] || 0, n.w));
  const xs = [0]; for (let d = 1; d < maxW.length; d++) xs[d] = xs[d - 1] + maxW[d - 1] + 64;
  nodes.forEach(n => { n.x = xs[n.depth]; n.vis.forEach(c => links.push([n, c])); });
  return { nodes, links };
}
function mmColors(n) {

  const c = branchColors()[n.branch % 8];
  return n.depth === 1 ? { fill: c, text: '#ffffff', stroke: c, link: c } : { fill: mix(c, 0.88), text: '#121a2f', stroke: c, link: c };
}
function mmMarkup(L, interactive) {
  const links = L.links.map(([a, b]) => {
    const x1 = a.x + a.w, y1 = a.y, x2 = b.x, y2 = b.y, mx = (x1 + x2) / 2;
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${mmColors(b).link}" stroke-width="${b.depth === 1 ? 2.5 : 1.6}" stroke-opacity=".7"/>`;
  }).join('');
  const nodes = L.nodes.map(n => {
    const c = mmColors(n), tx = n.w / 2 - (n.children.length ? 5 : 0);
    const text = n.lines.map((l, i) => `<tspan x="${tx}" y="${8 + n.fs + i * (n.fs + 4) - 2}">${esc(l)}</tspan>`).join('');
    const badge = interactive && n.children.length ? `<g><circle cx="${n.w}" cy="${n.h / 2}" r="10" fill="#fff" stroke="${c.stroke}" stroke-width="1.5"/><text x="${n.w}" y="${n.h / 2 + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="#121a2f">${n.vis.length ? '−' : '+' + n.children.length}</text></g>` : '';
    return `<g class="mmn" data-id="${n.id}" transform="translate(${n.x},${n.y - n.h / 2})" style="cursor:pointer"><rect width="${n.w}" height="${n.h}" rx="${n.depth === 0 ? 14 : 9}" fill="${c.fill}" stroke="${c.stroke}" stroke-width="1.5"/>
      <text text-anchor="middle" font-size="${n.fs}" font-weight="${n.depth < 2 ? 700 : 500}" fill="${c.text}" font-family="system-ui,-apple-system,Segoe UI,sans-serif">${text}</text>${badge}</g>`;

}
function mmBounds(L) {

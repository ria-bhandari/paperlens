  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
}

function viewMindmap(p) {
  if (!p.mindmap.children || !p.mindmap.children.length) { app().innerHTML = `<div class="done"><h2>No mind map</h2><p>The analysis didn't include one.</p></div>`; return; }
  const root = mmBuild(p.mindmap), byId = {}; (function idx(n) { byId[n.id] = n; n.children.forEach(idx); })(root);
  const collapsed = new Set(Object.values(byId).filter(n => n.depth >= 2 && n.children.length).map(n => n.id));
  const V = { x: 0, y: 0, k: 1 }; let L = null, sel = null;
  app().innerHTML = `
  <h2 style="font-size:26px;margin-bottom:6px">Mind map</h2>
  <p class="muted" style="margin-bottom:16px">Drag to move and scroll to zoom. Click a node to read its note and to open or close its branch.</p>
  <div class="mm-wrap">
    <div class="mm-bar">
      <button class="btn small" id="z-in" aria-label="Zoom in">＋</button><button class="btn small" id="z-out" aria-label="Zoom out">－</button><button class="btn small" id="z-fit">Fit</button>
      <button class="btn small" id="ex-all">Expand all</button><button class="btn small" id="col-all">Collapse</button>
      <span class="grow"></span><button class="btn small" id="dl-svg">${ICON.dl}SVG</button><button class="btn small" id="dl-png">${ICON.dl}PNG</button>
    </div>
    <svg id="mm" role="img" aria-label="Mind map of ${esc(p.meta.title)}"><g id="mmg"></g></svg>
    <div class="mm-note" id="mm-note"><span class="muted">Select a node to see its note.</span></div>
  </div>`;
  const svg = $('#mm'), g = $('#mmg');
  const apply = () => g.setAttribute('transform', `translate(${V.x},${V.y}) scale(${V.k})`);
  const draw = () => { L = mmLayout(root, collapsed); g.innerHTML = mmMarkup(L, true); apply(); };
  const fit = () => {
    const b = mmBounds(L), W = svg.clientWidth || 800, H = svg.clientHeight || 500;
    V.k = Math.min((W - 60) / b.w, (H - 60) / b.h, 1.15); V.x = (W - b.w * V.k) / 2 - b.x0 * V.k; V.y = (H - b.h * V.k) / 2 - b.y0 * V.k; apply();
  };
  const zoom = (f, cx, cy) => {
    const W = svg.clientWidth, H = svg.clientHeight; cx = cx ?? W / 2; cy = cy ?? H / 2;
    const k = Math.max(0.25, Math.min(3, V.k * f)); V.x = cx - (cx - V.x) * (k / V.k); V.y = cy - (cy - V.y) * (k / V.k); V.k = k; apply();
  };
  const showNote = n => { $('#mm-note').innerHTML = `<b>${esc(n.label)}</b>${n.note ? ' — ' + esc(n.note) : '<span class="muted"> — no extra note for this node.</span>'}`; };
  draw(); requestAnimationFrame(fit);
  const onResize = () => fit(); addEventListener('resize', onResize); S.cleanups.push(() => removeEventListener('resize', onResize));

  const toggle = n => {
    if (!n.children.length) return;
    const before = n.y * V.k + V.y;
    collapsed.has(n.id) ? collapsed.delete(n.id) : collapsed.add(n.id);
    draw(); const now = L.nodes.find(m => m.id === n.id); V.y += before - (now.y * V.k + V.y); apply();
  };
  let drag = null;
  svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, vx: V.x, vy: V.y, moved: false, id: e.target.closest('.mmn')?.dataset.id }; svg.setPointerCapture?.(e.pointerId); });
  svg.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true; if (drag.moved) { V.x = drag.vx + dx; V.y = drag.vy + dy; apply(); } });
  svg.addEventListener('pointerup', () => { if (drag && !drag.moved && drag.id != null) { const n = byId[drag.id]; sel = n; showNote(n); toggle(n); } drag = null; });
  svg.addEventListener('pointercancel', () => { drag = null; });
  svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  $('#z-in').onclick = () => zoom(1.25); $('#z-out').onclick = () => zoom(0.8); $('#z-fit').onclick = fit;
  $('#ex-all').onclick = () => { collapsed.clear(); draw(); fit(); };
  $('#col-all').onclick = () => { Object.values(byId).filter(n => n.depth >= 1 && n.children.length).forEach(n => collapsed.add(n.id)); draw(); fit(); };

  const standalone = () => {
    const b = mmBounds(L), pad = 30, W = Math.ceil(b.w + pad * 2), H = Math.ceil(b.h + pad * 2);
    const bg = document.documentElement.getAttribute('data-theme') === 'dark' ? '#0d1220' : '#ffffff';
    return { W, H, svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="${bg}"/><g transform="translate(${pad - b.x0},${pad - b.y0})">${mmMarkup(L, false)}</g></svg>` };
  };
  $('#dl-svg').onclick = () => download(slug(p.meta.title) + '-mindmap.svg', standalone().svg, 'image/svg+xml');
  $('#dl-png').onclick = () => {
    const s = standalone(), img = new Image(), sc = 2;
    img.onload = () => { const c = document.createElement('canvas'); c.width = s.W * sc; c.height = s.H * sc; const x = c.getContext('2d'); x.scale(sc, sc); x.drawImage(img, 0, 0); c.toBlob(b => download(slug(p.meta.title) + '-mindmap.png', b), 'image/png'); };
    img.onerror = () => toast('PNG export failed. Try SVG.');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s.svg);
  };
}

/* ---------- flashcards ---------- */
const CARD_TYPES = { concept: 'Concepts', method: 'Methods', result: 'Results', term: 'Terms', critique: 'Critique', missed: 'Missed in games' };
function viewCards(p) {
  if (!p.cards.length) { app().innerHTML = `<div class="done"><h2>No flashcards</h2><p>The analysis didn't include any.</p></div>`; return; }
  const all = p.cards.map((c, i) => Object.assign({ i }, c));
  const pk = p.id && p.id !== 'demo' ? progKey(p.id) : null, saved = pk ? ls.get(pk, null) : null;
  const F = { type: 'all', shuffled: false, known: new Set(saved ? arr(saved.known).filter(i => Number.isInteger(i) && i < all.length) : []), queue: [], flipped: false, again: 0, hard: 0 };
  const saveProg = () => { if (pk) ls.set(pk, { known: [...F.known], total: all.length, at: Date.now() }); };
  const pool = () => all.filter(c => F.type === 'all' || c.type === F.type);
  const rebuild = () => { const q = pool().filter(c => !F.known.has(c.i)); F.queue = F.shuffled ? shuffle(q) : q; F.flipped = false; };
  rebuild();
  const types = ['all', ...Object.keys(CARD_TYPES).filter(t => all.some(c => c.type === t))];
  if (S.cardFilter && types.includes(S.cardFilter)) { F.type = S.cardFilter; rebuild(); }
  S.cardFilter = null;

  const render = () => {
    const total = pool().length, done = pool().filter(c => F.known.has(c.i)).length, c = F.queue[0];
    app().innerHTML = `
    <div class="fc-top">${types.map(t => `<button class="pill" data-type="${t}" aria-pressed="${F.type === t}">${t === 'all' ? 'All' : CARD_TYPES[t]}</button>`).join('')}
      <span class="grow"></span>
      <button class="pill" id="shuf" aria-pressed="${F.shuffled}">Shuffle</button>
      <button class="btn small" id="anki">${ICON.dl}Anki file</button></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${total ? done / total * 100 : 0}%"></i></div>
    <p class="muted" style="margin-top:8px;font-size:14px">${done} of ${total} learned · ${F.queue.length} left${F.again + F.hard ? ` · ${F.again + F.hard} to revisit` : ''}</p>
    ${c ? `
    <div class="fc-stage"><div class="fc ${F.flipped ? 'flip' : ''}" id="fc" role="button" tabindex="0" aria-label="Flashcard. Press to flip.">
      <div class="face front"><span class="tag">${esc(CARD_TYPES[c.type] || 'Card')}</span>${esc(c.front)}<span class="hint">Click to flip</span></div>
      <div class="face back"><span class="tag">Answer</span>${esc(c.back)}</div></div></div>
    <div class="fc-act"><button class="btn again" id="again">Show again soon</button><button class="btn hard" id="hard">Hard, later</button><button class="btn got" id="got">I know this</button></div>
    <p class="keys">Space flips · 1 again · 2 hard · 3 know it</p>` : `
    <div class="done"><h2>${total ? 'That\'s the whole deck' : 'No cards in this set'}</h2><p>${total ? `You've been through all ${total} cards${F.again + F.hard ? ', and ' + (F.again + F.hard) + ' needed another look' : ' without a miss'}. Come back tomorrow to see what stuck.` : 'Choose another filter.'}</p>
      ${total ? '<button class="btn primary" id="restart">Review again</button>' : ''}</div>`}`;
    $$('[data-type]').forEach(b => b.onclick = () => { F.type = b.dataset.type; rebuild(); render(); });
    $('#shuf').onclick = () => { F.shuffled = !F.shuffled; rebuild(); render(); };
    $('#anki').onclick = () => download(slug(p.meta.title) + '-flashcards.txt', all.map(c => [c.front, c.back, c.type || ''].map(s => String(s).replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n'), 'text/plain');
    $('#fc')?.addEventListener('click', flip);
    $('#again')?.addEventListener('click', again); $('#hard')?.addEventListener('click', hard); $('#got')?.addEventListener('click', got);
    $('#restart')?.addEventListener('click', () => { pool().forEach(c => F.known.delete(c.i)); saveProg(); F.again = 0; F.hard = 0; rebuild(); render(); });
  };
  const flip = () => { F.flipped = !F.flipped; $('#fc')?.classList.toggle('flip', F.flipped); };
  const next = () => { F.flipped = false; render(); };
  const got = () => { const c = F.queue.shift(); if (c) { F.known.add(c.i); saveProg(); } next(); };
  const hard = () => { const c = F.queue.shift(); if (c) { F.hard++; F.queue.splice(Math.min(F.queue.length, 9), 0, c); } next(); };
  const again = () => { const c = F.queue.shift(); if (c) { F.again++; F.queue.splice(Math.min(F.queue.length, 4), 0, c); } next(); };
  S.keys = e => {
    if (e.key === ' ' || e.key === 'Enter') { if (document.activeElement?.tagName === 'BUTTON') return; e.preventDefault(); if (F.queue[0]) flip(); }
    else if (!F.queue[0]) return;
    else if (e.key === 'ArrowRight' || e.key === '3') got(); else if (e.key === 'ArrowLeft' || e.key === '1') again(); else if (e.key === '2') hard();
  };
  render();
}

/* ---------- games ---------- */
const best = { get: (m) => ls.get('pl.best.' + S.paper.id + '.' + m, null), set: (m, v) => ls.set('pl.best.' + S.paper.id + '.' + m, v) };
function viewPlay(p) {
  const nQ = p.quiz.length, nF = p.fof.length, nM = p.match.length;
  const bq = best.get('quiz'), bf = best.get('fof'), bm = best.get('match');
  app().innerHTML = `
  <h2 style="font-size:26px;margin-bottom:6px">Play with the paper</h2>
  <p class="muted" style="margin-bottom:20px">Three quick games built from this paper. Pick one and see how much stuck.</p>
  <div class="hub">
    <button class="game-tile" data-g="quiz" ${nQ < 3 ? 'disabled' : ''}><h3>Quiz blitz</h3><p>${nQ} questions, three lives, a clock, and streak bonuses. Wrong answers cost a life.</p><span class="best">${bq != null ? 'Best: ' + bq + ' pts' : 'No score yet'}</span></button>
    <button class="game-tile" data-g="fof" ${nF < 3 ? 'disabled' : ''}><h3>Fact or fiction</h3><p>${nF} statements about the paper. Some are true, some are subtly wrong. Decide fast.</p><span class="best">${bf != null ? 'Best: ' + bf + ' pts' : 'No score yet'}</span></button>
    <button class="game-tile" data-g="match" ${nM < 3 ? 'disabled' : ''}><h3>Pair up</h3><p>Match each key term with its meaning against the clock. Mistakes add time.</p><span class="best">${bm != null ? 'Best: ' + bm.toFixed(1) + ' s' : 'No time yet'}</span></button>
  </div>`;
  $$('.game-tile').forEach(b => b.onclick = () => ({ quiz: () => playQuiz('quiz'), fof: () => playQuiz('fof'), match: playMatch })[b.dataset.g]());
}

const RANKS = [[0, 'Reviewer 2 is not impressed'], [35, 'Skimmed the abstract'], [60, 'Read the methods, mostly'], [80, 'Solid grasp of the paper'], [95, 'Could have written this one']];
const rankFor = pct => RANKS.filter(r => pct >= r[0]).pop()[1];

function playQuiz(mode) {
  teardown();
  const p = S.paper, isQ = mode === 'quiz', secs = isQ ? 25 : 12;
  const items = shuffle(isQ ? p.quiz : p.fof).map(it => isQ
    ? { q: it.question, opts: shuffle(it.options.map((t, i) => ({ t, c: i === it.answer_index }))), why: it.explanation }
    : { q: it.statement, opts: [{ t: 'True', c: it.is_true }, { t: 'False', c: !it.is_true }], why: it.explanation });
  const G = { i: 0, lives: 3, score: 0, streak: 0, right: 0, answered: 0, left: secs, locked: false, missed: [] };
  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; }; S.cleanups.push(stop);

  const question = () => {
    const it = items[G.i]; G.locked = false; G.left = secs;
    app().innerHTML = `
    <div class="hud"><span>${isQ ? 'Question' : 'Statement'} ${G.i + 1} of ${items.length}</span><span class="grow"></span>
      <span>${G.streak > 1 ? 'Streak ×' + G.streak : ''}</span><span>${G.score} pts</span><span id="secs" aria-hidden="true">${secs}s</span>
      <span class="hearts" aria-label="${G.lives} lives left">${'♥'.repeat(G.lives)}<span class="off">${'♥'.repeat(3 - G.lives)}</span></span></div>
    <div class="timer"><i id="tbar"></i></div>
    <p class="q">${isQ ? '' : 'True or false: '}${esc(it.q)}</p>
    <div class="opts ${isQ ? '' : 'tf'}" id="opts">${it.opts.map((o, i) => `<button class="opt" data-i="${i}">${isQ ? `<kbd>${i + 1}</kbd>` : ''}<span>${esc(o.t)}</span></button>`).join('')}</div>
    <div id="after"></div>`;
    $$('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
    stop(); const t0 = Date.now();
    timer = setInterval(() => {
      G.left = secs - (Date.now() - t0) / 1000; const bar = $('#tbar'); if (!bar) return stop();
      bar.style.width = Math.max(0, G.left / secs * 100) + '%'; const sc = $('#secs'); if (sc) sc.textContent = Math.max(0, Math.ceil(G.left)) + 's'; bar.classList.toggle('low', G.left < secs * 0.3);
      if (G.left <= 0) answer(-1);
    }, 100);
  };
  const answer = idx => {
    if (G.locked) return; G.locked = true; stop();
    const it = items[G.i], ok = idx >= 0 && it.opts[idx].c; G.answered++;
    let gain = 0;
    if (ok) { G.right++; G.streak++; gain = 100 + Math.min(G.streak - 1, 5) * 20 + Math.round(Math.max(0, G.left) / secs * 50); G.score += gain; }
    else {
      G.lives--; G.streak = 0;
      const right = it.opts.find(o => o.c).t;
      G.missed.push({ front: (isQ ? '' : 'True or false: ') + it.q, back: (isQ ? 'Answer: ' : 'This is ') + right + (isQ ? '' : '.') + (it.why ? '\n\n' + it.why : '') });
    }
    $$('.opt').forEach((b, i) => {
      b.disabled = true;
      if (it.opts[i].c) { b.classList.add('right'); b.insertAdjacentHTML('beforeend', '<span class="mk" aria-hidden="true">✓</span><span class="sr">Correct answer</span>'); }
      else if (i === idx) { b.classList.add('wrong'); b.insertAdjacentHTML('beforeend', '<span class="mk" aria-hidden="true">✗</span><span class="sr">Your answer, incorrect</span>'); }
      else b.classList.add('dim');
    });
    const over = G.lives <= 0 || G.i === items.length - 1;
    $('#after').innerHTML = `<div class="explain"><p><b>${ok ? 'Correct' + (gain ? ' · +' + gain : '') : idx < 0 ? "Time's up" : 'Not quite'}</b></p>${it.why ? `<p>${esc(it.why)}</p>` : ''}</div>
      <div class="row" style="margin-top:16px"><button class="btn primary" id="nx">${over ? 'See results' : 'Next'}</button></div>`;
    $('#nx').focus(); $('#nx').onclick = () => { if (over) finish(); else { G.i++; question(); } };
  };
  const finish = () => {
    stop(); S.keys = null;
    const pct = G.answered ? Math.round(G.right / G.answered * 100) : 0, prev = best.get(mode), isBest = prev == null || G.score > prev;
    if (isBest) best.set(mode, G.score);
    app().innerHTML = `<div class="done"><p class="muted">${G.lives <= 0 ? 'Out of lives' : 'Finished'}</p><div class="score-big"><span class="mark">${G.score}</span></div>
      <p>${G.right} of ${G.answered} correct (${pct}%) · ${esc(rankFor(pct))}${isBest ? ' · New best!' : ''}</p>
      <div class="row" style="justify-content:center">${G.missed.length ? `<button class="btn primary" id="keep">Turn ${G.missed.length} missed into flashcards</button>` : ''}<button class="btn ${G.missed.length ? '' : 'primary'}" id="again">Play again</button><button class="btn" id="hub">All games</button></div></div>`;
    $('#again').onclick = () => playQuiz(mode); $('#hub').onclick = () => showPaper('play');
    $('#keep')?.addEventListener('click', () => { const have = new Set(p.cards.map(c => c.front)); G.missed.forEach(m => have.has(m.front) || p.cards.push({ front: m.front, back: m.back, type: 'missed', difficulty: 2 })); S.cardFilter = 'missed'; persistPaper(p); showPaper('cards'); });
  };
  S.keys = e => {
    if (G.locked) { if (e.key === 'Enter' || e.key === ' ') { /* button has focus */ } return; }
    const n = isQ ? +e.key - 1 : (e.key === 't' || e.key === 'T' || e.key === 'ArrowLeft') ? 0 : (e.key === 'f' || e.key === 'F' || e.key === 'ArrowRight') ? 1 : -9;
    if (n >= 0 && n < items[G.i].opts.length) answer(n);
  };
  question();
}

function playMatch() {
  teardown();
  const p = S.paper, pairs = p.match;
  const cards = shuffle(pairs.flatMap((x, i) => [{ pid: i, kind: 'term', t: x.term }, { pid: i, kind: 'def', t: x.definition }]));
  let sel = null, left = pairs.length, penalty = 0, t0 = null, tick = null;
  const stop = () => clearInterval(tick); S.cleanups.push(stop);
  app().innerHTML = `
  <div class="hud"><span>Match each term to its meaning</span><span class="grow"></span><span id="clock">0.0 s</span></div>
  <div class="match-grid">${cards.map((c, i) => `<button class="mcard ${c.kind}" data-i="${i}">${esc(c.t)}</button>`).join('')}</div>`;
  $$('.mcard').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, c = cards[i]; if (b.classList.contains('gone')) return;
    if (!t0) { t0 = Date.now(); tick = setInterval(() => { $('#clock') ? $('#clock').textContent = ((Date.now() - t0) / 1000 + penalty).toFixed(1) + ' s' : stop(); }, 100); }
    if (sel == null) { sel = i; b.classList.add('sel'); return; }
    const sb = $(`.mcard[data-i="${sel}"]`), sc = cards[sel];
    if (sel === i) { b.classList.remove('sel'); sel = null; return; }
    if (sc.kind === c.kind) { sb.classList.remove('sel'); sel = i; b.classList.add('sel'); return; }
    if (sc.pid === c.pid) {
      sb.classList.remove('sel'); sb.classList.add('gone'); b.classList.add('gone'); sel = null; left--;
      if (!left) finish();
    } else {
      penalty += 2; [sb, b].forEach(x => { x.classList.remove('sel'); x.classList.add('shake'); setTimeout(() => x.classList.remove('shake'), 400); }); sel = null;
    }
  });
  const finish = () => {
    stop(); const time = (Date.now() - t0) / 1000 + penalty, prev = best.get('match'), isBest = prev == null || time < prev;
    if (isBest) best.set('match', time);
    setTimeout(() => {
      app().innerHTML = `<div class="done"><p class="muted">All pairs matched</p><div class="score-big"><span class="mark">${time.toFixed(1)} s</span></div>
        <p>${penalty ? penalty / 2 + ' mistake' + (penalty > 2 ? 's' : '') + ' (+' + penalty + ' s)' : 'No mistakes'}${isBest ? ' · New best!' : ''}</p>
        <div class="row" style="justify-content:center"><button class="btn primary" id="again">Play again</button><button class="btn" id="hub">All games</button></div></div>`;
      $('#again').onclick = playMatch; $('#hub').onclick = () => showPaper('play');
    }, 450);
  };
}

/* ---------- boot ---------- */
$('#brand').onclick = () => showHome();
$('#btn-lib').onclick = () => showLibrary();
$('#btn-settings').onclick = () => openSettings();
$('#btn-look').onclick = openLook;
$('#btn-theme').onclick = () => { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); };
/* ---------- install as an app ---------- */
let deferredInstall = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('#btn-install').hidden = false; });
$('#btn-install').onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; $('#btn-install').hidden = true; };
addEventListener('appinstalled', () => { $('#btn-install').hidden = true; toast('Paperlens installed'); });
addEventListener('offline', () => toast('You are offline. Saved papers still work; new analyses need internet.'));
addEventListener('online', () => toast('Back online'));
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
migrateLegacy().then(refreshLibCount, () => {});
showHome();

</script>
